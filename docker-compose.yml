services:
  postgres:
    image: postgres:16-alpine
    container_name: bancoias-postgres
    environment:
      POSTGRES_DB: bancoias
      POSTGRES_USER: bancoias
      POSTGRES_PASSWORD: bancoias
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bancoias -d bancoias"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bancoias-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10