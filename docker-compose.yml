services:
  postgres:
    image: postgres:16-alpine
    container_name: bancoias-postgres
    environment:
      POSTGRES_DB: bancoias
      POSTGRES_USER: bancoias
      POSTGRES_PASSWORD: bancoias
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bancoias -d bancoias"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bancoias-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  backend:
    build: ./backend
    container_name: bancoias-backend
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/bancoias
      SPRING_R2DBC_USERNAME: bancoias
      SPRING_R2DBC_PASSWORD: bancoias
      SPRING_RABBITMQ_HOST: rabbitmq
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: bancoias-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend