server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Las llamadas /api se envían al backend: mismo origen, sin CORS.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Angular es una SPA: cualquier otra ruta devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}